<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tripistry | Travel Planning Platform</title>
    <meta
      name="description"
      content="Tripistry is a travel planning platform for discovering destinations, planning trips, and managing travel experiences."
    />
    <meta name="author" content="Ethan Van Eyden" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tripistry.ethanvaneyden.com/" />
    <!-- Open Graph -->
    <meta property="og:title" content="Tripistry | Travel Planning Platform" />
    <meta
      property="og:description"
      content="Tripistry is a travel planning platform for discovering destinations, planning trips, and managing travel experiences."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tripistry.ethanvaneyden.com/" />
    <meta
      property="og:image"
      content="https://tripistry.ethanvaneyden.com/assets/logo.png"
    />
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/auth.css" rel="stylesheet" />
  </head>

  <body>
    <div class="auth-container">
      <img src="assets/logo.png" class="logo" alt="logo" />
      <div class="auth-heading">
        <h1 class="text-center">Login</h1>
        <h2 class="text-center">Please enter your details to login</h2>
      </div>

      <div class="auth-card clear-glass">
        <form class="auth-form">
          <input
            type="email"
            id="email"
            placeholder="Email address"
            required
            autocomplete="email"
          />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
            autocomplete="current-password"
          />
          <button type="submit" id="submit">Sign In</button>
        </form>

        <div class="auth-footer" id="auth-footer">
          <div class="error-container" id="error-container"></div>
          <p>
            Don't have an account?<br />
            <a href="traveller/registertraveller.html">Register as Traveler</a
            ><br />
            <a href="agency/registeragency.html">Register as Agency</a>
          </p>
        </div>
      </div>
    </div>
    <script src="js/login.js"></script>
  </body>
</html>
