<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create Package</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/nav.css" rel="stylesheet" />
    <link href="../css/packages.css" rel="stylesheet" />
    <link href="../css/createpackage.css" rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <header>
      <nav class="navbar" id="navbar"></nav>
    </header>
    <main>
      <div class="breadcrumb">
        <a href="#" class="concept-link">Agency Home</a>
        <span class="breadcrumb-separator">/</span>
        <span class="concept-current">Create Package</span>
      </div>

      <section class="create-container clear-glass">
        <h2 class="section-title">Create new travel package</h2>

        <div class="main-details">
          <input type="text" placeholder="Package Title" id="titleInput" />
          <input
            type="textarea"
            placeholder="Package Description"
            id="descriptionInput"
          />
        </div>

        <div class="secondary-details">
          <input type="date" placeholder="Start Date" id="startDateInput" />
          <input type="date" placeholder="End Date" id="endDateInput" />
          <input
            type="number"
            placeholder="Max Participants"
            id="maxParticipantsInput"
          />
          <input type="number" placeholder="Total Price" id="priceInput" />
        </div>

        <h2 class="section-title">Link Resources</h2>
        <div class="side-by-side">
          <div class="resource-group">
            <button class="resource" id="addFlight">
              <p>Add flight</p>
              <i class="bi bi-plus"></i>
            </button>
            <button class="resource" id="addDestination">
              <p>Add destination</p>
              <i class="bi bi-plus"></i>
            </button>
          </div>

          <div class="resource-group">
            <button class="resource" id="addAccomodation">
              <p>Add accomodation</p>
              <i class="bi bi-plus"></i>
            </button>
            <button class="resource" id="addRestuarant">
              <p>Add restuarant</p>
              <i class="bi bi-plus"></i>
            </button>
          </div>
        </div>
        <button class="publish-button" id="publishPackage">Publish package</button>
      </section>
    </main>
  </body>
  <script src="../js/agency-header.js"></script>
  <script src="../js/agency-packages.js"></script>
</html>
