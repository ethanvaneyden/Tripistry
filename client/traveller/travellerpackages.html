<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My packages</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/nav.css" rel="stylesheet" />
    <link href="../css/packages.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <header>
      <nav class="navbar" id="navbar"></nav>
    </header>
    <main>
      <div class="breadcrumb">
        <a href="#" class="concept-link">Traveller Home</a>
        <span class="breadcrumb-separator">/</span>
        <span class="concept-current">My Bookings</span>
      </div>

      <section class="package-section clear-glass">
      </section>
    </main>

    <!-- Confirmation Modal -->
    <dialog id="confirmationModal" class="glass-modal">
      <div class="modal-header">
        <h2 id="confirmTitle">Confirm Action</h2>
        <button class="close-x-btn" id="confirmClose">×</button>
      </div>
      <div class="modal-body">
        <p id="confirmMessage">Are you sure?</p>
      </div>
      <div class="modal-actions">
        <button id="confirmYes" class="btn-confirm-yes">Confirm</button>
        <button id="confirmNo" class="btn-confirm-no">Cancel</button>
      </div>
    </dialog>
  </body>
  <script src="../js/traveller-header.js"></script>
  <script src="../js/traveller-bookings.js"></script>
</html>
