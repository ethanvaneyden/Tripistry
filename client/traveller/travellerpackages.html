<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My packages</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="" />
    <link href="../css/style.css" rel="stylesheet" />
    <link href="../css/nav.css" rel="stylesheet" />
    <link href="../css/packages.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <header>
      <nav class="navbar" id="navbar"></nav>
    </header>
    <main>
      <h1 class="section-heading">Your Bookings</h1>

      <section class="package-section clear-glass">
        <div class="package-card">
          <img
            class="package-image"
            src="https://newplacestogo.com/wp-content/uploads/2023/02/bartinney-2-min-scaled.jpg"
            alt="Wineyard"
          />
          <div class="card-content">
            <h2 class="card-title">Ultimate Cape Town Coastal Escape</h2>
            <h3 class="card-destination">Capetown, South Africa</h3>
            <p class="card-description">
              A beautiful getaway featuring coastal sights, wine tasting, and
              premium dining.
            </p>

            <ul class="card-meta">
              <li class="card-date">15-22 June <small>7 nights</small></li>
              <li class="card-price">R14500.00 <small>/ person</small></li>
              <li class="card-agency">Offered by Wanderlust SA Ltd</li>
              <li class="rating">
                <span class="stars">★★★★☆</span>
                <span>4.7</span>
              </li>
            </ul>
            <a href="packagedetails.html" class="btn-outline">
              View package<i class="bi bi-chevron-double-right"></i>
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
  <script src="../js/traveller-header.js"></script>
</html>
